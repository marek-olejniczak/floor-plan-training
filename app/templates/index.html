<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Detekcja — YOLO</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="container">
  <header>
    <h1>Detekcja na rzutach</h1>
    <p class="subtitle">YOLO11s — przeciągnij zdjęcie rzutu architektonicznego</p>
  </header>

  <div class="drop-zone" id="dropZone">
    <span class="drop-hint">Przeciągnij plik tutaj lub kliknij aby wybrać</span>
    <input type="file" id="fileInput" accept="image/*" hidden>
  </div>

  <div class="controls" id="controls" hidden>
    <div class="control-row">
      <label for="confSlider">Próg ufności: <span id="confValue">0.25</span></label>
      <input type="range" id="confSlider" min="0.05" max="0.95" step="0.05" value="0.25">
    </div>
    <div class="stats" id="stats">
      <span>Wykryte: <strong id="totalCount">0</strong></span>
      <span id="perClass" class="per-class"></span>
      <span>Śr. ufność: <strong id="avgConf">—</strong></span>
    </div>
    <div class="class-toggles" id="classToggles"></div>
    <div class="zoom-controls">
      <button id="zoomResetBtn">Reset zoom</button>
      <span id="zoomLevelDisplay">100%</span>
    </div>
  </div>

  <div class="canvas-wrapper" id="canvasWrapper" hidden>
    <div class="canvas-container">
      <img id="sourceImage" style="display:none">
      <canvas id="mainCanvas"></canvas>
    </div>
  </div>

  <div class="loading" id="loading" hidden>
    <div class="spinner"></div>
    <span>Analizowanie...</span>
  </div>

  <div class="error" id="error" hidden></div>
</div>

<script>
const dropZone = document.getElementById('dropZone');
const fileInput = document.getElementById('fileInput');
const canvasWrapper = document.getElementById('canvasWrapper');
const mainCanvas = document.getElementById('mainCanvas');
const sourceImage = document.getElementById('sourceImage');
const loading = document.getElementById('loading');
const error = document.getElementById('error');
const controls = document.getElementById('controls');
const confSlider = document.getElementById('confSlider');
const confValue = document.getElementById('confValue');
const totalCount = document.getElementById('totalCount');
const perClass = document.getElementById('perClass');
const avgConf = document.getElementById('avgConf');
const classToggles = document.getElementById('classToggles');
const zoomResetBtn = document.getElementById('zoomResetBtn');
const zoomLevelDisplay = document.getElementById('zoomLevelDisplay');

const CLASS_COLORS = {
  wall:   { stroke: '#2ecc71', fill: 'rgba(46, 204, 113, 0.25)' },
  door:   { stroke: '#3498db', fill: 'rgba(52, 152, 219, 0.25)' },
  window: { stroke: '#f39c12', fill: 'rgba(243, 156, 18, 0.25)' },
};
const FALLBACK_COLOR = { stroke: '#e74c3c', fill: 'rgba(231, 76, 60, 0.25)' };

let rawDetections = [];
let currentImageData = null;

// Zoom & pan state
let zoomLevel = 1;
let panX = 0, panY = 0;
let isPanning = false;
let panStartX = 0, panStartY = 0;
let currentThreshold = 0.25;

// Class visibility
let visibleClasses = new Set();

// --- Drag & Drop ---
dropZone.addEventListener('click', () => fileInput.click());
dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
dropZone.addEventListener('drop', (e) => {
  e.preventDefault();
  dropZone.classList.remove('dragover');
  const file = e.dataTransfer.files[0];
  if (file) handleFile(file);
});
fileInput.addEventListener('change', () => {
  if (fileInput.files[0]) handleFile(fileInput.files[0]);
});

// --- Obsluga pliku ---
function handleFile(file) {
  if (!file.type.startsWith('image/')) {
    showError('Wybierz plik graficzny (JPG, PNG)');
    return;
  }

  const reader = new FileReader();
  reader.onload = function(e) {
    currentImageData = e.target.result;
    sourceImage.onload = function() {
      resetView();
      setupCanvas(sourceImage);
      sendPrediction(currentImageData);
    };
    sourceImage.src = currentImageData;
  };
  reader.readAsDataURL(file);
}

function resetView() {
  zoomLevel = 1;
  panX = 0;
  panY = 0;
  isPanning = false;
  updateZoomDisplay();
}

function setupCanvas(img) {
  const maxW = Math.min(img.naturalWidth, 1400);
  const maxH = Math.min(img.naturalHeight, 900);
  mainCanvas.width = maxW;
  mainCanvas.height = maxH;
  canvasWrapper.hidden = false;
}

function drawBackground() {
  const ctx = mainCanvas.getContext('2d');
  ctx.fillStyle = '#1a1a2e';
  ctx.fillRect(0, 0, mainCanvas.width, mainCanvas.height);
}

function drawImage() {
  const ctx = mainCanvas.getContext('2d');
  const img = sourceImage;
  ctx.drawImage(img, 0, 0, mainCanvas.width, mainCanvas.height);
}

// --- Wysylanie do backendu ---
async function sendPrediction(imageData) {
  loading.hidden = false;
  error.hidden = true;
  controls.hidden = true;

  try {
    const blob = await (await fetch(imageData)).blob();
    const formData = new FormData();
    formData.append('file', blob, 'rzut.jpg');

    const resp = await fetch('/predict', { method: 'POST', body: formData });
    const data = await resp.json();

    if (data.error) {
      showError(data.error);
      return;
    }

    rawDetections = data.detections;
    controls.hidden = false;
    currentThreshold = parseFloat(confSlider.value);
    buildClassToggles();
    updateStats();
    render();
  } catch (err) {
    showError('Blad polaczenia z serwerem: ' + err.message);
  } finally {
    loading.hidden = true;
  }
}

// --- Zoom & Pan ---

function applyTransform(ctx) {
  ctx.setTransform(zoomLevel, 0, 0, zoomLevel, panX, panY);
}

function resetTransform(ctx) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}

function updateZoomDisplay() {
  zoomLevelDisplay.textContent = Math.round(zoomLevel * 100) + '%';
}

function clampZoom() {
  zoomLevel = Math.max(0.1, Math.min(20, zoomLevel));
}

mainCanvas.addEventListener('wheel', (e) => {
  if (!rawDetections.length) return;
  e.preventDefault();

  const rect = mainCanvas.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;

  const oldZoom = zoomLevel;
  const factor = e.deltaY < 0 ? 1.1 : 0.9;
  zoomLevel *= factor;
  clampZoom();

  panX = mx - (mx - panX) * (zoomLevel / oldZoom);
  panY = my - (my - panY) * (zoomLevel / oldZoom);

  updateZoomDisplay();
  updateCanvasCursor();
  render();
}, { passive: false });

mainCanvas.addEventListener('mousedown', (e) => {
  if (!rawDetections.length) return;
  if (e.button !== 0) return;
  isPanning = true;
  panStartX = e.clientX - panX;
  panStartY = e.clientY - panY;
  mainCanvas.style.cursor = 'grabbing';
});

window.addEventListener('mousemove', (e) => {
  if (!isPanning) return;
  panX = e.clientX - panStartX;
  panY = e.clientY - panStartY;
  render();
});

window.addEventListener('mouseup', () => {
  if (isPanning) {
    isPanning = false;
    updateCanvasCursor();
  }
});

zoomResetBtn.addEventListener('click', () => {
  resetView();
  updateCanvasCursor();
  render();
});

function updateCanvasCursor() {
  mainCanvas.style.cursor = zoomLevel !== 1 ? 'grab' : 'default';
}

// --- Class toggles ---

function buildClassToggles() {
  const classes = [...new Set(rawDetections.map(d => d.class))].sort();
  visibleClasses = new Set(classes);

  classToggles.innerHTML = '';
  for (const cls of classes) {
    const color = CLASS_COLORS[cls] || FALLBACK_COLOR;
    const label = document.createElement('label');
    label.className = 'class-toggle';
    label.innerHTML = `
      <input type="checkbox" class="cls-cb" value="${cls}" checked>
      <span class="color-dot" style="background:${color.stroke}"></span>
      ${cls}
    `;
    const cb = label.querySelector('.cls-cb');
    cb.addEventListener('change', () => {
      if (cb.checked) {
        visibleClasses.add(cls);
      } else {
        visibleClasses.delete(cls);
      }
      render();
    });
    classToggles.appendChild(label);
  }
}

// --- Render ---

function render() {
  const ctx = mainCanvas.getContext('2d');
  const img = sourceImage;
  const threshold = currentThreshold;

  ctx.clearRect(0, 0, mainCanvas.width, mainCanvas.height);

  applyTransform(ctx);
  drawBackground();
  drawImage();

  const filtered = rawDetections.filter(d => d.confidence >= threshold && visibleClasses.has(d.class));

  for (const det of filtered) {
    const scaleX = mainCanvas.width / img.naturalWidth;
    const scaleY = mainCanvas.height / img.naturalHeight;
    const verts = det.vertices.map(v => [
      v[0] * scaleX,
      v[1] * scaleY,
    ]);
    const color = CLASS_COLORS[det.class] || FALLBACK_COLOR;

    ctx.beginPath();
    ctx.moveTo(verts[0][0], verts[0][1]);
    for (let i = 1; i < verts.length; i++) {
      ctx.lineTo(verts[i][0], verts[i][1]);
    }
    ctx.closePath();

    ctx.fillStyle = color.fill;
    ctx.fill();
    ctx.strokeStyle = color.stroke;
    ctx.lineWidth = 2 / zoomLevel;
    ctx.stroke();

    const cx = verts.reduce((s, v) => s + v[0], 0) / verts.length;
    const cy = verts.reduce((s, v) => s + v[1], 0) / verts.length;
    const label = `${det.class} ${(det.confidence * 100).toFixed(0)}%`;
    const fontSize = Math.max(10, 13 / zoomLevel);
    ctx.font = `${fontSize}px sans-serif`;
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    const tw = ctx.measureText(label).width;
    const lh = fontSize + 7;
    ctx.fillRect(cx - tw/2 - 4, cy - lh/2, tw + 8, lh);
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(label, cx, cy + 1);
  }

  resetTransform(ctx);

  totalCount.textContent = filtered.length;
  updatePerClass(filtered);
}

// --- Statystyki ---
function updateStats() {
  const confs = rawDetections.map(d => d.confidence);
  avgConf.textContent = confs.length
    ? (confs.reduce((a, b) => a + b, 0) / confs.length * 100).toFixed(1) + '%'
    : '—';
}

function updatePerClass(detections) {
  const counts = {};
  for (const d of detections) {
    counts[d.class] = (counts[d.class] || 0) + 1;
  }
  perClass.innerHTML = Object.entries(counts)
    .sort((a, b) => b[1] - a[1])
    .map(([cls, n]) => {
      const color = CLASS_COLORS[cls] || FALLBACK_COLOR;
      return `<span class="cls-badge" style="background:${color.fill}; color:${color.stroke}">${cls}: ${n}</span>`;
    })
    .join(' ');
}

// --- Suwak confidence ---
confSlider.addEventListener('input', function() {
  confValue.textContent = parseFloat(this.value).toFixed(2);
  currentThreshold = parseFloat(this.value);
  if (rawDetections.length) render();
});

// --- Obsluga bledow ---
function showError(msg) {
  error.textContent = msg;
  error.hidden = false;
  loading.hidden = true;
}
</script>
</body>
</html>
