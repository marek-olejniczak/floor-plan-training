[project]
name = "trening"
version = "0.1.0"
description = "YOLO detection training for floor plan elements"
requires-python = ">=3.11"
dependencies = [
    "ultralytics>=8.3",
    "numpy<2.0",
    "opencv-python-headless<5.0",
    "pyyaml>=6.0",
    "wandb>=0.28.1",
    "nvidia-cublas-cu12>=12.9.2.10",
    "nvidia-cuda-runtime-cu12>=12.9.79",
    "nvidia-cudnn-cu12>=9.25.0.15",
    "nvidia-cufft-cu12>=11.4.1.4",
    "nvidia-curand-cu12>=10.3.10.19",
    "nvidia-cusolver-cu12>=11.7.5.82",
    "nvidia-cusparse-cu12>=12.5.10.65",
    "nvidia-nccl-cu12>=2.30.7",
    "polars[rtcompat]>=1.42.1",
    "flask>=3.1.3",
    "pillow>=12.3.0",
]

[tool.uv]
python-preference = "system"

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
